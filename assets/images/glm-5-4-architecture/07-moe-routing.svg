<g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<rect x="1" y="1" width="918" height="397" rx="24" fill="#FFFFFF" stroke="#D9E4EF" stroke-width="2"/>
<rect x="40" y="37" width="9" height="42" rx="4" fill="#1264AC" stroke="none" stroke-width="2"/>
<text x="65" y="69" text-anchor="start" font-size="38" font-weight="750" fill="#10243B">同一组专家，两轮可以选不同的</text>
<text x="40" y="145" text-anchor="start" font-size="30" font-weight="700" fill="#10243B">共享专家池</text><rect x="322" y="108" width="104" height="63" rx="15" fill="#F0F4F8" stroke="none" stroke-width="2"/><text x="374.0" y="150.0" text-anchor="middle" font-size="30" font-weight="650" fill="#10243B">A</text><rect x="462" y="108" width="104" height="63" rx="15" fill="#F0F4F8" stroke="none" stroke-width="2"/><text x="514.0" y="150.0" text-anchor="middle" font-size="30" font-weight="650" fill="#10243B">B</text><rect x="602" y="108" width="104" height="63" rx="15" fill="#F0F4F8" stroke="none" stroke-width="2"/><text x="654.0" y="150.0" text-anchor="middle" font-size="30" font-weight="650" fill="#10243B">C</text><rect x="742" y="108" width="104" height="63" rx="15" fill="#F0F4F8" stroke="none" stroke-width="2"/><text x="794.0" y="150.0" text-anchor="middle" font-size="30" font-weight="650" fill="#10243B">D</text><text x="40" y="237" text-anchor="start" font-size="30" font-weight="700" fill="#1264AC">第一轮</text><text x="164" y="237" text-anchor="start" font-size="28" font-weight="500" fill="#10243B">隐藏状态 1</text><path d="M325 227H448" fill="none" stroke="#7490AA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="462" y="194" width="181" height="65" rx="15" fill="#E5F2FF" stroke="none" stroke-width="2"/><text x="552.5" y="237.0" text-anchor="middle" font-size="30" font-weight="650" fill="#1264AC">专家 A、C</text><text x="40" y="321" text-anchor="start" font-size="30" font-weight="700" fill="#0D715C">第二轮</text><text x="164" y="321" text-anchor="start" font-size="28" font-weight="500" fill="#10243B">隐藏状态 2</text><path d="M325 311H448" fill="none" stroke="#7490AA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="462" y="278" width="181" height="65" rx="15" fill="#DDF5EB" stroke="none" stroke-width="2"/><text x="552.5" y="321.0" text-anchor="middle" font-size="30" font-weight="650" fill="#0D715C">专家 B、D</text><text x="40" y="375" text-anchor="start" font-size="28" font-weight="500" fill="#425A73">专家数量和选择仅用于说明路由可随隐藏状态变化。</text>
