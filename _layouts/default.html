<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0b0c0e">
    {%- seo -%}
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    {%- if page.math -%}
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        },
        options: {
          skipHtmlTags: ['pre', 'code', 'script', 'style', 'textarea']
        }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    {%- endif -%}
    <script defer src="https://cdn.jsdelivr.net/npm/mermaid@11.12.1/dist/mermaid.min.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        var blocks = document.querySelectorAll('pre > code.language-mermaid');

        blocks.forEach(function (code, index) {
          var container = document.createElement('div');
          container.className = 'mermaid';
          if (index === 0 && !document.getElementById('evidence-01')) {
            container.id = 'evidence-01';
          }
          container.setAttribute('role', 'img');
          container.setAttribute('aria-label', 'Mermaid 图示 ' + (index + 1));
          container.textContent = code.textContent;
          code.parentElement.replaceWith(container);
        });

        if (window.mermaid && blocks.length) {
          window.mermaid.initialize({
            startOnLoad: false,
            securityLevel: 'strict',
            theme: 'base',
            themeVariables: {
              darkMode: true,
              background: '#111318',
              primaryColor: '#122620',
              primaryTextColor: '#e6e8ec',
              primaryBorderColor: '#34d399',
              lineColor: '#52606d',
              secondaryColor: '#161b22',
              tertiaryColor: '#111318',
              mainBkg: '#122620',
              nodeBorder: '#34d399',
              clusterBkg: '#0d0f14',
              clusterBorder: '#262d38',
              titleColor: '#e6e8ec',
              edgeLabelBackground: '#111318',
              textColor: '#e6e8ec'
            }
          });
          window.mermaid.run({ querySelector: '.mermaid' });
        }

        // Auto-open WeChat drawer when clicking any #wechat anchor
        document.querySelectorAll('a[href$="#wechat"]').forEach(function (link) {
          link.addEventListener('click', function () {
            var drawer = document.getElementById('wechat-drawer');
            if (drawer && drawer.tagName === 'DETAILS') {
              drawer.open = true;
            }
          });
        });
      });
    </script>
  </head>
  <body class="page-{{ page.layout | default: 'default' }}">
    <a class="skip-link" href="#main-content">跳到正文</a>
    {% include site-header.html %}
    <main id="main-content">
      {{ content }}
    </main>
    {% include site-footer.html %}
  </body>
</html>
