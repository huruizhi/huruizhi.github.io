{% assign target = page.article_url | relative_url %}
<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' | escape }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }}</title>
  <link rel="canonical" href="{{ page.article_url | absolute_url | escape }}">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="refresh" content="0; url={{ target | escape }}">
  <style>html,body{margin:0;padding:24px;background:#0b0c0e;color:#e6e8ec;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}a{color:#34d399}</style>
</head>
<body>
  <a href="{{ target | escape }}">打开交互全文</a>
</body>
</html>
