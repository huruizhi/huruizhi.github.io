<svg xmlns="http://www.w3.org/2000/svg" width="920" height="388" viewBox="0 0 920 388" role="img" aria-labelledby="diagram-title">
<title id="diagram-title">第二轮沿用第一轮选出的位置</title>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 10 6 1 11" fill="none" stroke="#7490AA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<rect x="1" y="1" width="918" height="386" rx="24" fill="#FFFFFF" stroke="#D9E4EF" stroke-width="2"/>
<rect x="40" y="37" width="9" height="42" rx="4" fill="#1264AC" stroke="none" stroke-width="2"/>
<text x="65" y="69" text-anchor="start" font-size="38" font-weight="750" fill="#10243B">第二轮沿用第一轮选出的位置</text>
<text x="40" y="123" text-anchor="start" font-size="29" font-weight="700" fill="#10243B">第一轮</text><text x="535" y="123" text-anchor="start" font-size="29" font-weight="700" fill="#10243B">第二轮</text><rect x="40" y="141" width="337" height="60" rx="15" fill="#F0F4F8" stroke="none" stroke-width="2"/><text x="208.5" y="181.5" text-anchor="middle" font-size="30" font-weight="650" fill="#10243B">Indexer 选位置</text><path d="M205 205V226" fill="none" stroke="#7490AA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="233" width="337" height="60" rx="15" fill="#E5F2FF" stroke="none" stroke-width="2"/><text x="208.5" y="273.5" text-anchor="middle" font-size="30" font-weight="650" fill="#1264AC">位置 3、8、12</text><path d="M385 263H529" fill="none" stroke="#7490AA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="457" y="247" text-anchor="middle" font-size="26" font-weight="650" fill="#425A73">复用</text><rect x="535" y="233" width="345" height="60" rx="15" fill="#DDF5EB" stroke="none" stroke-width="2"/><text x="707.5" y="273.5" text-anchor="middle" font-size="30" font-weight="650" fill="#0D715C">重新计算 Attention</text><rect x="535" y="141" width="345" height="60" rx="15" fill="#F0F4F8" stroke="none" stroke-width="2"/><text x="707.5" y="181.5" text-anchor="middle" font-size="30" font-weight="650" fill="#10243B">本轮的 Query</text><path d="M708 205V226" fill="none" stroke="#7490AA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="40" y="348" text-anchor="start" font-size="28" font-weight="500" fill="#425A73">位置沿用，Attention 权重随本轮 Query 重新计算。</text>
